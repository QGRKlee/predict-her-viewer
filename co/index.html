<html lang="en"><head><meta charset="utf-8">

<title>Sophie</title>

<style>
:root{color-scheme:dark;--floor:#140B10;--ground:#471A2E;--plum:#7B2950;--rose:#E32B5D;--raspberry:#BB1752;--pink:#EF6A90}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--floor);color:#fff;font-family:'Josefin Sans','Avenir Next','Segoe UI',system-ui,sans-serif;font-weight:300;font-size:16px;line-height:1.5;display:grid;place-items:center;
 background-image:radial-gradient(900px 480px at 70% -10%,color-mix(in srgb,var(--plum) 60%,transparent),transparent 70%);background-repeat:no-repeat;
 padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:400px;background:color-mix(in srgb,var(--ground) 62%,var(--floor));border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:32px 28px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:52px;line-height:.9;margin:0}
p{margin:10px 0 0;color:rgba(255,255,255,.74)}
label{display:block;margin:26px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);font-weight:600}
input{width:100%;background:var(--floor);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:12px 14px 11px;font:inherit}
button{margin-top:14px;width:100%;appearance:none;font:inherit;font-weight:600;letter-spacing:.06em;color:#fff;background:var(--rose);border:1px solid var(--rose);border-radius:999px;padding:12px 18px 11px;cursor:pointer}
button:hover{background:var(--raspberry);border-color:var(--raspberry)}button[disabled]{opacity:.5;cursor:default}
input:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#msg{min-height:1.5em;font-size:14px}
.mask{-webkit-text-security:disc;text-security:disc}
label.show{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:14px;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.74);font-weight:300}
label.show input{width:auto;accent-color:var(--rose)}
</style></head>
<body><main>
<h1>Sophie</h1>
<p>She gives more than she receives.</p>
<form id="f" autocomplete="off">

<input id="pw" type="text" class="mask" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore autofocus>
<label class="show"><input type="checkbox" id="show"> Show what I typed</label>
<button id="go" type="submit">Open</button>
</form>
<p id="msg" role="status"></p>
</main>

      var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(P.i)},key,dec(P.c));
      var html=new TextDecoder().decode(plain);
      document.open();document.write(html);document.close();
    }catch(err){go.disabled=false;msg.textContent="That password did not open it. Clear the box and type it by hand: a browser sometimes fills in a saved one. Tick the box to see what you typed.";$("pw").focus()}
  });
})();
